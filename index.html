<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Смаковница — доставка роллов и суши в Москве</title>
  <meta name="theme-color" content="#131D1C">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // Before the first paint: the motion preference (mirrors src/lib/scroll.js) so CSS is right from frame one
    (function () {
      var m = null;
      try {
        var p = new URLSearchParams(location.search).get('motion');
        m = p === 'on' || p === 'off' ? p : p === 'auto' ? null : localStorage.getItem('smak-motion');
      } catch (e) {}
      document.documentElement.dataset.motion = (m ? m === 'off' : matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'reduce' : 'full';
    })();
  </script>
  <style>html { background: #131D1C; }</style>
  <link rel="preload" href="/node_modules/@fontsource/jost/files/jost-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/node_modules/@fontsource/prata/files/prata-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Render-blocking on purpose: the first paint is always the styled page -->
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
